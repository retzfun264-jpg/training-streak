<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Streak</title>

<style>
:root{
  --notion-bg:#191919;

  --widget-bg:#111318;
  --panel:rgba(255,255,255,.055);
  --border:rgba(255,255,255,.10);

  --text:#f5f7fa;
  --muted:#8f96a1;

  --accent:#ff6b35;
  --accent2:#63d7ff;
  --accent3:#9b7bff;
  --rest:#9b7bff;

  --radius:20px;
  --blur:24px;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  padding:10px;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;

  color:var(--text);

  /* Notion-like background */
  background:#191919;
}


/* =====================================================
   WIDGET
===================================================== */

.widget{
  position:relative;

  width:100%;
  max-width:620px;
  margin:auto;

  overflow:hidden;

  border:1px solid var(--border);
  border-radius:var(--radius);

  background:
    radial-gradient(
      circle at 0% 0%,
      rgba(155,123,255,.18),
      transparent 32%
    ),
    radial-gradient(
      circle at 100% 20%,
      rgba(99,215,255,.12),
      transparent 30%
    ),
    radial-gradient(
      circle at 50% 110%,
      rgba(255,107,53,.12),
      transparent 35%
    ),
    linear-gradient(
      145deg,
      #191c23,
      #101217 70%
    );

  backdrop-filter:blur(var(--blur));
  -webkit-backdrop-filter:blur(var(--blur));

  box-shadow:
    0 25px 70px rgba(0,0,0,.38),
    inset 0 1px rgba(255,255,255,.07);
}


/* subtle glass shine */

.widget::before{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      120deg,
      rgba(255,255,255,.07),
      transparent 25%,
      transparent 70%,
      rgba(255,255,255,.025)
    );
}


/* =====================================================
   HEADER
===================================================== */

.header{
  position:relative;
  z-index:2;

  padding:17px 18px 13px;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.icon{
  width:36px;
  height:36px;

  display:grid;
  place-items:center;

  border-radius:11px;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent3)
    );

  box-shadow:
    0 8px 25px
    color-mix(
      in srgb,
      var(--accent) 22%,
      transparent
    );
}

.icon svg{
  width:19px;
}

.title{
  font-size:15px;
  font-weight:750;
  letter-spacing:-.4px;
}

.subtitle{
  margin-top:2px;

  color:var(--muted);

  font-size:9px;
}

.settings-btn{
  width:32px;
  height:32px;

  padding:0;

  display:grid;
  place-items:center;

  border:1px solid var(--border);
  border-radius:10px;

  background:rgba(255,255,255,.05);

  color:var(--text);

  cursor:pointer;

  transition:.2s;
}

.settings-btn:hover{
  background:rgba(255,255,255,.10);
  transform:translateY(-1px);
}


/* =====================================================
   STATS
===================================================== */

.stats{
  position:relative;
  z-index:2;

  padding:3px 18px 15px;

  display:grid;
  grid-template-columns:1fr 1fr;

  gap:10px;
}

.stat{
  padding:13px;

  border:1px solid rgba(255,255,255,.07);
  border-radius:15px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.065),
      rgba(255,255,255,.025)
    );

  box-shadow:
    inset 0 1px rgba(255,255,255,.035);
}

.stat-label{
  color:var(--muted);

  font-size:9px;
}

.stat-value{
  margin-top:4px;

  font-size:22px;
  font-weight:800;

  letter-spacing:-1px;
}

.stat-value span{
  font-size:10px;

  color:var(--muted);

  font-weight:500;
}

.stat-value .fire{
  color:var(--accent);

  font-size:19px;
}


/* =====================================================
   DAYS
===================================================== */

.days{
  position:relative;
  z-index:2;

  padding:0 18px 18px;
}

.days-header{
  margin-bottom:9px;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.days-title{
  font-size:11px;
  font-weight:650;
}

.days-help{
  color:var(--muted);
  font-size:8px;
}

.day-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}

.day{
  min-width:0;
}

.day-name{
  margin-bottom:5px;

  text-align:center;

  color:var(--muted);

  font-size:8px;
  font-weight:600;
}

.day-button{
  width:100%;
  aspect-ratio:1;

  padding:0;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:2px;

  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.05),
      rgba(255,255,255,.025)
    );

  color:var(--text);

  cursor:pointer;

  transition:
    transform .18s,
    background .18s,
    border .18s;
}

.day-button:hover{
  transform:translateY(-1px);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.035)
    );
}

.day-number{
  font-size:11px;
  font-weight:700;
}

.day-status{
  font-size:7px;
  color:var(--muted);
}


/* TRAINING */

.day.training .day-button{
  border-color:
    color-mix(
      in srgb,
      var(--accent) 60%,
      transparent
    );

  background:
    radial-gradient(
      circle at 50% 0%,
      color-mix(
        in srgb,
        var(--accent) 22%,
        transparent
      ),
      transparent 70%
    ),
    rgba(255,255,255,.035);

  box-shadow:
    inset 0 0 20px
    color-mix(
      in srgb,
      var(--accent) 7%,
      transparent
    );
}

.day.training .day-status{
  color:var(--accent);
}


/* REST */

.day.rest .day-button{
  border-color:
    color-mix(
      in srgb,
      var(--rest) 55%,
      transparent
    );

  background:
    radial-gradient(
      circle at 50% 0%,
      color-mix(
        in srgb,
        var(--rest) 18%,
        transparent
      ),
      transparent 70%
    ),
    rgba(255,255,255,.035);
}

.day.rest .day-status{
  color:var(--rest);
}


/* TODAY */

.day.today .day-button{
  box-shadow:
    0 0 0 1px var(--accent),
    0 0 20px
    color-mix(
      in srgb,
      var(--accent) 14%,
      transparent
    );
}


/* =====================================================
   PROGRESS
===================================================== */

.progress-section{
  position:relative;
  z-index:2;

  padding:0 18px 18px;
}

.progress-top{
  margin-bottom:7px;

  display:flex;
  justify-content:space-between;

  font-size:9px;
}

.progress-top span:first-child{
  color:var(--muted);
}

.progress-bar{
  height:5px;

  overflow:hidden;

  border-radius:10px;

  background:rgba(255,255,255,.07);
}

.progress-fill{
  height:100%;

  width:0;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      var(--accent),
      var(--accent3),
      var(--accent2)
    );

  box-shadow:
    0 0 14px
    color-mix(
      in srgb,
      var(--accent) 25%,
      transparent
    );

  transition:width .3s ease;
}


/* =====================================================
   EDITOR
===================================================== */

.editor{
  position:relative;
  z-index:3;

  display:none;

  padding:17px 18px;

  border-top:1px solid var(--border);

  background:
    linear-gradient(
      145deg,
      rgba(0,0,0,.25),
      rgba(0,0,0,.12)
    );
}

.editor.open{
  display:block;
}

.editor-title{
  display:flex;
  justify-content:space-between;

  margin-bottom:12px;
}

.editor-title strong{
  font-size:12px;
}

.editor-title span{
  color:var(--muted);
  font-size:8px;
}

.editor-grid{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:9px;
}

.editor-card{
  padding:11px;

  border:1px solid rgba(255,255,255,.07);
  border-radius:14px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.025)
    );
}

.editor-card h3{
  margin:0 0 9px;

  color:var(--muted);

  font-size:8px;

  text-transform:uppercase;

  letter-spacing:.5px;
}

.colors{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.color{
  width:24px;
  height:24px;

  padding:0;

  border-radius:8px;

  border:2px solid transparent;

  cursor:pointer;
}

.color.active{
  border-color:white;

  box-shadow:
    0 0 0 2px
    rgba(255,255,255,.15);
}

.orange{background:#ff6b35}
.blue{background:#63d7ff}
.purple{background:#9b7bff}
.green{background:#58d68d}
.red{background:#ff5c7a}
.yellow{background:#ffd166}

.range{
  width:100%;
}

.range-value{
  margin-top:4px;

  color:var(--muted);

  font-size:8px;
}

.toggle{
  display:flex;
  align-items:center;
  justify-content:space-between;

  font-size:9px;
}

.switch{
  width:32px;
  height:18px;

  padding:0;

  position:relative;

  border:0;
  border-radius:20px;

  background:#383d45;

  cursor:pointer;
}

.switch::after{
  content:"";

  position:absolute;

  top:2px;
  left:2px;

  width:14px;
  height:14px;

  border-radius:50%;

  background:white;

  transition:.2s;
}

.switch.active{
  background:var(--accent);
}

.switch.active::after{
  left:16px;
}

.editor-actions{
  margin-top:10px;

  display:flex;
  justify-content:flex-end;

  gap:7px;
}

.editor-actions button{
  padding:8px 11px;

  border:1px solid var(--border);
  border-radius:10px;

  background:rgba(255,255,255,.05);

  color:var(--text);

  font-size:9px;

  cursor:pointer;
}

.save{
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent3)
    ) !important;

  border-color:transparent !important;

  color:white;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:430px){

  body{
    padding:6px;
  }

  .header{
    padding:14px;
  }

  .stats,
  .days,
  .progress-section{
    padding-left:14px;
    padding-right:14px;
  }

  .editor{
    padding:14px;
  }

  .editor-grid{
    grid-template-columns:1fr;
  }

  .day-grid{
    gap:4px;
  }

  .day-button{
    border-radius:10px;
  }
}
</style>
</head>


<body>

<div class="widget">

<header class="header">

  <div class="brand">

    <div class="icon">

      <svg viewBox="0 0 24 24"
           fill="none"
           stroke="white"
           stroke-width="2">

        <path d="M6 12l4 4L18 8"/>
        <path d="M4 4h16v16H4z"/>

      </svg>

    </div>

    <div>

      <div class="title">
        Training Streak
      </div>

      <div class="subtitle">
        Consistency tracker
      </div>

    </div>

  </div>

  <button
    class="settings-btn"
    id="settingsButton">

    ⚙

  </button>

</header>


<section class="stats">

  <div class="stat">

    <div class="stat-label">
      CURRENT STREAK
    </div>

    <div class="stat-value">

      <span class="fire">🔥</span>

      <span id="currentStreak">
        0
      </span>

      <span>
        days
      </span>

    </div>

  </div>


  <div class="stat">

    <div class="stat-label">
      BEST STREAK
    </div>

    <div class="stat-value">

      <span id="bestStreak">
        0
      </span>

      <span>
        days
      </span>

    </div>

  </div>

</section>


<section class="days">

  <div class="days-header">

    <div class="days-title">
      This week
    </div>

    <div
      class="days-help"
      id="weekProgress">

      0 / 7

    </div>

  </div>


  <div
    class="day-grid"
    id="dayGrid">
  </div>

</section>


<section class="progress-section">

  <div class="progress-top">

    <span>
      Weekly progress
    </span>

    <span id="progressText">
      0%
    </span>

  </div>

  <div class="progress-bar">

    <div
      class="progress-fill"
      id="progressFill">
    </div>

  </div>

</section>


<section
  class="editor"
  id="editor">

  <div class="editor-title">

    <strong>
      Customization
    </strong>

    <span>
      Saved automatically
    </span>

  </div>


  <div class="editor-grid">


    <div class="editor-card">

      <h3>
        Accent color
      </h3>

      <div class="colors">

        <button
          class="color orange active"
          data-color="#ff6b35">
        </button>

        <button
          class="color blue"
          data-color="#63d7ff">
        </button>

        <button
          class="color purple"
          data-color="#9b7bff">
        </button>

        <button
          class="color green"
          data-color="#58d68d">
        </button>

        <button
          class="color red"
          data-color="#ff5c7a">
        </button>

        <button
          class="color yellow"
          data-color="#ffd166">
        </button>

      </div>

    </div>


    <div class="editor-card">

      <h3>
        Glass blur
      </h3>

      <input
        class="range"
        id="blurRange"
        type="range"
        min="0"
        max="40"
        value="24">

      <div
        class="range-value"
        id="blurValue">

        24px

      </div>

    </div>


    <div class="editor-card">

      <h3>
        Corner radius
      </h3>

      <input
        class="range"
        id="radiusRange"
        type="range"
        min="8"
        max="30"
        value="20">

      <div
        class="range-value"
        id="radiusValue">

        20px

      </div>

    </div>


    <div class="editor-card">

      <h3>
        Display
      </h3>

      <div class="toggle">

        Light mode

        <button
          class="switch"
          id="themeSwitch">
        </button>

      </div>

    </div>

  </div>


  <div class="editor-actions">

    <button id="reset">
      Reset
    </button>

    <button
      class="save"
      id="save">

      ✓ Save

    </button>

  </div>

</section>

</div>


<script>

const $ = id =>
  document.getElementById(id);

const root =
  document.documentElement;


/* =====================================================
   WEEK
===================================================== */

const dayNames =
  ["MON","TUE","WED","THU","FRI","SAT","SUN"];

const today =
  new Date();

const todayIndex =
  (today.getDay() + 6) % 7;


let week =
  JSON.parse(
    localStorage.getItem(
      "trainingStreakWeek"
    ) || "null"
  );


if(!week || week.length !== 7){

  week =
    Array(7).fill("none");

}


/* =====================================================
   RENDER DAYS
===================================================== */

function renderDays(){

  $("dayGrid").innerHTML = "";

  week.forEach((status,index)=>{

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "day " +
      (
        status === "training"
          ? "training "
          : ""
      ) +
      (
        status === "rest"
          ? "rest "
          : ""
      ) +
      (
        index === todayIndex
          ? "today"
          : ""
      );


    const button =
      document.createElement("button");

    button.className =
      "day-button";


    button.innerHTML = `

      <div class="day-number">
        ${dayNames[index]}
      </div>

      <div class="day-status">

        ${
          status === "training"
            ? "TRAIN"
            : status === "rest"
              ? "REST"
              : "—"
        }

      </div>

    `;


    button.addEventListener(
      "click",
      ()=>{

        if(
          week[index] === "none"
        ){

          week[index] =
            "training";

        }else if(
          week[index] === "training"
        ){

          week[index] =
            "rest";

        }else{

          week[index] =
            "none";

        }


        localStorage.setItem(
          "trainingStreakWeek",
          JSON.stringify(week)
        );


        renderDays();
        updateStats();

      }
    );


    wrapper.appendChild(button);

    $("dayGrid")
      .appendChild(wrapper);

  });

}


/* =====================================================
   STATS
===================================================== */

function calculateStreak(){

  let current = 0;
  let best = 0;
  let temp = 0;


  for(
    let i=0;
    i<7;
    i++
  ){

    if(
      week[i] === "training"
    ){

      temp++;

      best =
        Math.max(
          best,
          temp
        );

    }else if(
      week[i] === "rest"
    ){

      temp++;

      best =
        Math.max(
          best,
          temp
        );

    }else{

      temp = 0;

    }

  }


  for(
    let i=todayIndex;
    i>=0;
    i--
  ){

    if(
      week[i] === "training" ||
      week[i] === "rest"
    ){

      current++;

    }else{

      break;

    }

  }


  return {
    current,
    best
  };

}


function updateStats(){

  const streak =
    calculateStreak();


  $("currentStreak")
    .textContent =
    streak.current;


  $("bestStreak")
    .textContent =
    streak.best;


  const completed =
    week.filter(
      x =>
        x === "training" ||
        x === "rest"
    ).length;


  const percent =
    Math.round(
      completed / 7 * 100
    );


  $("weekProgress")
    .textContent =
    completed + " / 7";


  $("progressText")
    .textContent =
    percent + "%";


  $("progressFill")
    .style.width =
    percent + "%";

}


renderDays();
updateStats();


/* =====================================================
   EDITOR
===================================================== */

$("settingsButton")
.addEventListener(
  "click",
  ()=>{

    $("editor")
      .classList.toggle("open");

  }
);


/* =====================================================
   COLORS
===================================================== */

document
.querySelectorAll(".color")
.forEach(button=>{

  button.addEventListener(
    "click",
    ()=>{

      const color =
        button.dataset.color;


      root.style.setProperty(
        "--accent",
        color
      );


      document
      .querySelectorAll(".color")
      .forEach(x =>
        x.classList.remove("active")
      );


      button.classList.add(
        "active"
      );


      saveStyle();

    }
  );

});


/* =====================================================
   BLUR
===================================================== */

$("blurRange")
.addEventListener(
  "input",
  e=>{

    const value =
      e.target.value;


    root.style.setProperty(
      "--blur",
      value + "px"
    );


    $("blurValue")
      .textContent =
      value + "px";


    saveStyle();

  }
);


/* =====================================================
   RADIUS
===================================================== */

$("radiusRange")
.addEventListener(
  "input",
  e=>{

    const value =
      e.target.value;


    root.style.setProperty(
      "--radius",
      value + "px"
    );


    $("radiusValue")
      .textContent =
      value + "px";


    saveStyle();

  }
);


/* =====================================================
   SAVE STYLE
===================================================== */

function saveStyle(){

  localStorage.setItem(
    "trainingStreakStyle",

    JSON.stringify({

      accent:
        getComputedStyle(root)
        .getPropertyValue(
          "--accent"
        ),

      blur:
        getComputedStyle(root)
        .getPropertyValue(
          "--blur"
        ),

      radius:
        getComputedStyle(root)
        .getPropertyValue(
          "--radius"
        )

    })
  );

}


$("save")
.addEventListener(
  "click",
  ()=>{

    saveStyle();


    $("save")
      .textContent =
      "✓ Saved";


    setTimeout(
      ()=>{

        $("save")
          .textContent =
          "✓ Save";

      },
      1200
    );

  }
);


/* =====================================================
   RESET
===================================================== */

$("reset")
.addEventListener(
  "click",
  ()=>{

    root.style.setProperty(
      "--accent",
      "#ff6b35"
    );

    root.style.setProperty(
      "--blur",
      "24px"
    );

    root.style.setProperty(
      "--radius",
      "20px"
    );


    $("blurRange").value =
      24;

    $("radiusRange").value =
      20;


    $("blurValue")
      .textContent =
      "24px";

    $("radiusValue")
      .textContent =
      "20px";


    document
    .querySelectorAll(".color")
    .forEach(x =>
      x.classList.remove("active")
    );


    document
    .querySelector(
      ".color.orange"
    )
    .classList.add("active");


    saveStyle();

  }
);


/* =====================================================
   LOAD
===================================================== */

const savedStyle =
  JSON.parse(
    localStorage.getItem(
      "trainingStreakStyle"
    ) || "null"
  );


if(savedStyle){

  if(savedStyle.accent){

    root.style.setProperty(
      "--accent",
      savedStyle.accent
    );

  }


  if(savedStyle.blur){

    root.style.setProperty(
      "--blur",
      savedStyle.blur
    );


    $("blurRange").value =
      parseInt(
        savedStyle.blur
      );


    $("blurValue")
      .textContent =
      savedStyle.blur;

  }


  if(savedStyle.radius){

    root.style.setProperty(
      "--radius",
      savedStyle.radius
    );


    $("radiusRange").value =
      parseInt(
        savedStyle.radius
      );


    $("radiusValue")
      .textContent =
      savedStyle.radius;

  }

}

</script>

</body>
</html>
